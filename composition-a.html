<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #1a1a1a; width: 1920px; height: 1080px; overflow: hidden;
           font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    .clip { opacity: 0; }
    #headline { opacity: 1; }
    #supporting { opacity: 0; }
  </style>
</head>
<body
  data-composition-id="attention-a"
  data-start="0"
  data-duration="5"
  data-width="1920"
  data-height="1080">

  <!-- Headline: visible from frame 0, holds full 5 s -->
  <div
    id="headline"
    class="clip"
    data-start="0"
    data-duration="5"
    data-track-index="0"
    style="
      position: absolute;
      left: 160px; top: 300px;
      color: #f5f5f0;
      font-size: 112px;
      font-weight: 700;
      line-height: 1.1;
      max-width: 1400px;
    ">Make room for one idea.</div>

  <!-- Supporting line: A starts at 1.2 s, fades over 0.3 s -->
  <div
    id="supporting"
    class="clip"
    data-start="1.2"
    data-duration="3.8"
    data-track-index="1"
    style="
      position: absolute;
      left: 160px; top: 476px;
      color: #9a9a9a;
      font-size: 40px;
      font-weight: 400;
    ">Everything else can wait.</div>

  <script>
    (function() {
      var tl = gsap.timeline({ paused: true });
      tl.fromTo('#supporting',
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: 'power1.in' },
        1.2
      );
      tl.to('#supporting', { opacity: 1, duration: 3.5 }, 1.5);
      window.__timelines = window.__timelines || {};
      window.__timelines['attention-a'] = tl;
    })();
  </script>
</body>
</html>
